<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/icon-192.png" />
    <meta property="og:image" content="/brand/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060b" />
    <meta name="description" content="FireFly - FireFly Club, associated with AMIEE." />
    <meta name="author" content="M Muthu Kumaran" />
    <title>FireFly // FireFly Club</title>
    <style>
      /* Shown the instant the page opens, before any script has loaded; the real loader takes over seamlessly. */
      html, body { margin: 0; background: #03040a; }
      #boot { position: fixed; inset: 0; z-index: 300; overflow: hidden; background: radial-gradient(70% 60% at 18% 8%, #33140b 0%, transparent 62%), radial-gradient(70% 70% at 88% 96%, #3d0f22 0%, transparent 64%), radial-gradient(50% 50% at 50% 50%, #2a120c 0%, transparent 70%), #03040a; transition: opacity 0.4s ease; }
      #boot::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(80vw, 80vh); aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 140, 60, 0.2), rgba(232, 25, 44, 0.14) 50%, rgba(139, 92, 246, 0.08) 66%, transparent 76%); filter: blur(14px); animation: boot-breathe 3.6s ease-in-out infinite alternate; }
      #boot i { position: absolute; left: 50%; top: 50%; width: 210px; height: 38px; translate: -50% -50%; background: rgba(255, 255, 255, 0.12); }
      #boot i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #ffb347, #ff6a2b 45%, #e8192c); transform-origin: left; animation: boot-fill 6s cubic-bezier(0.2, 0.6, 0.2, 1) forwards; }
      #boot b { position: absolute; left: min(1vw, 15.6px); bottom: min(0.4vw, 6px); font: 400 min(6.7vw, 104px)/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.03em; background: linear-gradient(90deg, #ffd27a, #ff8a3d 30%, #ff4a2b 62%, #d4142a); -webkit-background-clip: text; background-clip: text; color: transparent; }
      @keyframes boot-breathe { from { scale: 0.9; opacity: 0.75; } to { scale: 1.08; opacity: 1; } }
      @keyframes boot-fill { from { transform: scaleX(0); } to { transform: scaleX(0.04); } }
      @media (max-width: 767px) { #boot b { font-size: 24vw; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><i></i><b>000</b></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
